# ==============================================================================
# Generated by Auto GitHub Actions (auto-gha)
# Security & Vulnerability Scanning Workflow (Level: standard)
# ==============================================================================

name: Security & Vulnerability Scans
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  dependency-audit:
    name: Dependency Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run npm-audit
        run: if [ -f package-lock.json ]; then npm audit --audit-level=high; else for dir in $(find . -name 'package-lock.json' -not -path '*/node_modules/*' -exec dirname {} \;); do (cd "$dir" && echo "Auditing $dir..." && npm audit --audit-level=high); done; fi
        continue-on-error: true
      - name: Run govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && if [ -f go.mod ]; then govulncheck ./...; else for mod in $(find . -name 'go.mod' -not -path '*/.*'); do (cd "$(dirname "$mod")" && echo "Auditing $(dirname "$mod")..." && govulncheck ./...); done; fi
        continue-on-error: true
  container-security:
    name: Container & Manifest Security (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Scan repository & Docker manifests with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: HIGH,CRITICAL
        continue-on-error: true
