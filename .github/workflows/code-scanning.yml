# ==============================================================================
# Generated by Auto GitHub Actions (auto-gha)
# Code Scanning & SAST Workflow (Level: standard)
# ==============================================================================

name: Code Scanning & Security Analyzers
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
  security-events: write
  pull-requests: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hadolint:
    name: Dockerfile Lint (Hadolint)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Lint Dockerfile with Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: cardnet/docker/analytics-service/Dockerfile
          format: sarif
          output-file: hadolint.sarif
          no-fail: true
      - name: Upload Hadolint scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: hadolint.sarif
  njsscan:
    name: Node.js Static Analysis (njsscan)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run njsscan
        uses: ajinabraham/njsscan-action@master
        with:
          args: . --sarif --output njsscan.sarif
      - name: Upload njsscan scan results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: njsscan.sarif
  dependency-review:
    name: Dependency Review (PR)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Dependency Review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: critical
        continue-on-error: true
  osv-scanner:
    name: Open Source Vulnerability Scan (Google OSV)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Run Google OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@v2.5.1
        with:
          scan-args: --call-analysis=false --format=sarif --output=osv-results.sarif .
        continue-on-error: true
      - name: Upload OSV-Scanner results
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: osv-results.sarif
