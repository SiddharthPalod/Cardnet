# ==============================================================================
# Generated by Auto GitHub Actions (auto-gha)
# Workflow: Node.js CI, Go CI, Docker Build, Publish Docker Image (GHCR) (4 jobs)
# Configuration: Parallel DAG | Dependency Caching: Enabled | Production Hardening: Disabled
# ==============================================================================

name: CI/CD Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test-node:
    name: Node.js CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: "**/package-lock.json"
  test-go:
    name: Go CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true
      - run: go build -v ./...
      - run: go test -v ./...
  build-docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs:
      - test-node
      - test-go
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          push: false
          file: cardnet/docker/analytics-service/Dockerfile
          context: .
  deploy-ghcr:
    name: Publish Docker Image (GHCR)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs:
      - test-node
      - test-go
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
      - uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ steps.ghcr-meta.outputs.tags }}
          labels: ${{ steps.ghcr-meta.outputs.labels }}
          file: cardnet/docker/analytics-service/Dockerfile
          context: .
